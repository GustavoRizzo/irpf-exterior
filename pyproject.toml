[project]
name = "irpf-exterior"
version = "0.1.0"
description = "Núcleo de domínio da apuração de IRPF sobre investimentos no exterior (Lei 14.754/2023)."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "grizzo" }]
dependencies = []

[project.optional-dependencies]
simbolico = ["sympy>=1.13"]

[project.urls]
Documentation = "https://github.com/grizzo/irpf-exterior"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irpf_exterior"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.7",
    "sympy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "scripts"]
disallow_any_explicit = true

[[tool.mypy.overrides]]
module = ["sympy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
# Documentos de entrada: o ruff reformata blocos de código dentro de Markdown.
extend-exclude = ["pre-project-docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF", "SIM", "C4", "PT", "D"]
# RUF001-003: o projeto é escrito em português; travessões e acentos não são "ambíguos" aqui.
# E741/N803/N806: os nomes seguem o glossário do documento de referência (I, F, C_i, R_br).
ignore = ["D203", "D213", "D401", "E741", "N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]
"scripts/*" = ["D100", "D103"]

# Única exceção a `disallow_any_explicit` no domínio, prevista na seção 4.6 da
# arquitetura: a assinatura genérica de `Formula.calcular` (ver a nota em _base.py).
[[tool.mypy.overrides]]
module = ["irpf_exterior.formulas._base"]
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["irpf_exterior.simbolico"]
warn_return_any = false
disallow_any_explicit = false
disallow_any_decorated = false
