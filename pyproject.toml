[project]
name = "irpf-exterior"
dynamic = ["version"]
description = "Núcleo de domínio da apuração de IRPF sobre investimentos no exterior (Lei 14.754/2023)."
readme = "README.md"
# 3.12 é o mínimo: o código usa a sintaxe de genéricos da PEP 695 (`class Money[M]`, `type X = ...`).
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gustavo Rizzo S M de Albuquerque" }]
keywords = ["irpf", "imposto de renda", "receita federal", "lei 14.754", "offshore", "portugal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
simbolico = ["sympy>=1.13"]

[project.urls]
Homepage = "https://github.com/GustavoRizzo/irpf-exterior"
Repository = "https://github.com/GustavoRizzo/irpf-exterior"
Documentation = "https://github.com/GustavoRizzo/irpf-exterior/blob/main/docs/desenvolvimento/guia-de-uso.md"
Issues = "https://github.com/GustavoRizzo/irpf-exterior/issues"

[build-system]
# 1.27 é a primeira versão com `license-files` e expressão SPDX (PEP 639).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Fonte única da versão: `__version__` em __init__.py.
[tool.hatch.version]
path = "src/irpf_exterior/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/irpf_exterior"]

# O sdist leva o suficiente para rodar a suíte (tests/ importa de scripts/ e lê docs/),
# mas não os documentos de entrada nem arquivos de ferramenta.
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "docs", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.7",
    "sympy>=1.13",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
disallow_any_explicit = true

[[tool.mypy.overrides]]
module = ["sympy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
# Documentos de entrada: o ruff reformata blocos de código dentro de Markdown.
extend-exclude = ["pre-project-docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF", "SIM", "C4", "PT", "D"]
# RUF001-003: o projeto é escrito em português; travessões e acentos não são "ambíguos" aqui.
# E741/N803/N806: os nomes seguem o glossário do documento de referência (I, F, C_i, R_br).
ignore = ["D203", "D213", "D401", "E741", "N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]
"scripts/*" = ["D100", "D103"]

# Única exceção a `disallow_any_explicit` no domínio, prevista na seção 4.6 da
# arquitetura: a assinatura genérica de `Formula.calcular` (ver a nota em _base.py).
[[tool.mypy.overrides]]
module = ["irpf_exterior.formulas._base"]
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["irpf_exterior.simbolico"]
warn_return_any = false
disallow_any_explicit = false
disallow_any_decorated = false
